name: fd-production

x-runtime: &runtime
  platform: linux/amd64
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}

services:
  game:
    <<: *runtime
    image: ${FD_GAME_IMAGE:?pinned image required}
    mem_limit: 256m
    stop_grace_period: 45s
    volumes:
      - /srv/fd/game:/var/lib/fd
    networks: [game]

  web-proxy:
    <<: *runtime
    image: ${FD_PROXY_IMAGE:?pinned image required}
    mem_limit: 128m
    environment:
      NODE_OPTIONS: --max-old-space-size=64
      MUD_ROUTES: '{"fd":{"host":"game","port":4000,"encoding":"windows-1251"}}'
      ENABLE_LEGACY_ROUTING: "false"
      DEFAULT_ENCODING: windows-1251
      CHAT_ENABLED: "false"
      COMPRESS: "false"
      DEBUG: "false"
      LOG_LEVEL: warn
      MAX_CONNECTIONS: "32"
      RATE_LIMIT_PER_IP: "30"
      ALLOWED_ORIGINS: https://fd.dreamiurg.net
    depends_on:
      game: {condition: service_healthy}
    networks: [game, web]

  web:
    <<: *runtime
    image: ${FD_WEB_IMAGE:?pinned image required}
    mem_limit: 64m
    tmpfs: ["/tmp:size=16m,mode=1777"]
    depends_on: [web-proxy]
    networks: [web]

  caddy:
    <<: *runtime
    image: docker.io/library/caddy:2.11.7-alpine@sha256:04913b1da43339a40ad1ea87827d70a576ac5aa6cf674c6e24fdca675887533a
    user: "10001:10001"
    # The official binary has this file capability even on high ports.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    environment:
      GOMEMLIMIT: 96MiB
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/fd/private/gate.caddy:/etc/caddy/gate.caddy:ro
      - /srv/fd/caddy:/data
      - /srv/fd/caddy-config:/config
    depends_on: [web]
    networks: [web, edge]

networks:
  game: {internal: true}
  web: {internal: true}
  edge: {}
